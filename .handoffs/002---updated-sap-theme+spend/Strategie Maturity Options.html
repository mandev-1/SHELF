<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Strategie — Maturity Options</title>
<link rel="stylesheet" href="maturity/options.css" />
<link rel="stylesheet" href="maturity/full.css" />
<link rel="stylesheet" href="maturity/futur.css" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="maturity/option-a.jsx"></script>
<script type="text/babel" src="maturity/option-bc.jsx"></script>
<script type="text/babel" src="maturity/full-a.jsx"></script>
<script type="text/babel" src="maturity/full-bc.jsx"></script>
<script type="text/babel" src="maturity/futur-hud.jsx"></script>
<script type="text/babel" src="maturity/futur-bc.jsx"></script>
<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="futur" title="Futuristic · three bolder directions" subtitle="Same data — HUD console, aurora glass, orbital system. Motion language at the foot of each board.">
        <DCArtboard id="f1" label="F1 · HUD — mission-control console, corner ticks, glow telemetry" width={560} height={760}>
          <FuturHUD />
        </DCArtboard>
        <DCArtboard id="f2" label="F2 · Aurora glass — gradient mesh, frosted panels, shimmer hero" width={560} height={760}>
          <FuturAurora />
        </DCArtboard>
        <DCArtboard id="f3" label="F3 · Orbital — your money as a system around the core" width={560} height={620}>
          <FuturOrbital />
        </DCArtboard>
      </DCSection>
      <DCSection id="comp" title="Strategie · Composition directions" subtitle="Same data, three postures — each board lists its motion language at the bottom">
        <DCArtboard id="a" label="A · Ledger — terminal density, hairlines, no cards" width={560} height={560}>
          <OptionA />
        </DCArtboard>
        <DCArtboard id="b" label="B · Editorial — one hero number, calm grid" width={560} height={560}>
          <OptionB />
        </DCArtboard>
        <DCArtboard id="c" label="C · Cockpit — rail nav, sticky instrument band" width={640} height={560}>
          <OptionC />
        </DCArtboard>
      </DCSection>
      <DCSection id="full" title="Full page · all sections in each direction" subtitle="Header → KPIs → projection → weekly → method → diff → programs → pots → categories">
        <DCArtboard id="fa" label="A · Ledger — one document, hairlines, 2-col below fold" width={620} height={1050}>
          <FullA />
        </DCArtboard>
        <DCArtboard id="fb" label="B · Editorial — hero number, calm 2×2 of everything else" width={620} height={1050}>
          <FullB />
        </DCArtboard>
        <DCArtboard id="fc" label="C · Cockpit — rail + sticky band, no long scroll" width={720} height={1050}>
          <FullC />
        </DCArtboard>
      </DCSection>
      <DCSection id="notes" title="How they differ" subtitle="">
        <DCPostIt id="n1">A removes all card chrome — structure comes from hairlines and column rhythm. Fastest feel; motion is nearly invisible (120ms).</DCPostIt>
        <DCPostIt id="n2">B bets on hierarchy: one number you read first, everything else secondary. Springs + stagger make it feel hand-finished.</DCPostIt>
        <DCPostIt id="n3">C restructures: left rail replaces scrolling soup; sections crossfade in place. Most work, most "product" of the three.</DCPostIt>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
