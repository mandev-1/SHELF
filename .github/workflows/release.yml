name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION. Run 'npm run release:new', commit, then tag v$PKG_VERSION."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build release bundle
        run: npm run release:rebuild
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Read release version
        id: version
        run: echo "version=$(cat .release-version)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SHeLF v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            releases/${{ steps.version.outputs.version }}.zip
            releases/${{ steps.version.outputs.version }}.tar.gz