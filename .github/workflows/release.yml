name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION. Run 'npm run release:new', commit, then tag v$PKG_VERSION."
            exit 1
          fi

      - name: Zip the tagged releases/<version> folder
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package-latest.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: SHeLF v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            releases/${{ steps.pkg.outputs.version }}.zip
            releases/${{ steps.pkg.outputs.version }}.tar.gz
